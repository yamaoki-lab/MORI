# PR ごとに, supervisor の Go のコードを gofmt, go vet, テストで確かめる.
# テストは OS に依存しない (コマンドの出力の解析と偽の Manager だけ) ので, Linux の1か所で回す.
# macOS 用のファイル (manager_darwin.go) は Linux では組み立てられないので, go vet だけ GOOS=darwin でも見る.
name: CI

on:
  pull_request:

permissions:
  contents: read

# 同じ PR に続けて push したら, 古い方の実行は止める.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # PR の画面と Ruleset に出る確認の名前.
    name: check
    runs-on: ubuntu-latest
    # 止まらなくなった時に, 既定の6時間まで走らせ続けないようにする.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supervisor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: supervisor/go.mod # yamaoki-lint:ignore
          # 依存が無く go.sum も無いので, 依存のキャッシュは使わない.
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: go vet (darwin)
        run: GOOS=darwin go vet ./...
      - run: go test -race ./...
